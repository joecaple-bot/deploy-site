<!doctype html>
<meta charset="utf-8">
<title>Miniature race gallery</title>
<style>
body{margin:0;background:#151a22;color:#eef3fa;font:14px system-ui}header{position:sticky;top:0;z-index:2;display:flex;gap:18px;align-items:center;padding:12px 18px;background:#202936}label{display:flex;gap:7px;align-items:center}select{padding:5px;background:#111721;color:inherit;border:1px solid #536278;border-radius:4px}main{position:relative;max-width:1200px;margin:auto}canvas{display:block;width:100%;height:auto}.labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);pointer-events:none}.labels span{align-self:end;transform:translateY(-25px);text-align:center;padding:5px;color:#fff;text-shadow:0 1px 3px #000;background:linear-gradient(transparent,#111a)}
</style>
<header><strong>19-race geometry gallery</strong><label>Outfit <select id="outfit"></select></label><label>Hair <select id="hair"></select></label><label>Headwear <select id="headgear"></select></label><label>Race detail <select id="raceDetail"></select></label><label><input id="rotate" type="checkbox" checked> Rotate</label></header>
<main><canvas width="1200" height="820"></canvas><div class="labels"></div></main>
<script src="../vendor/three.min.js"></script><script src="../miniature_idle.js"></script><script src="../miniature_races.js"></script><script src="../miniature_editor.js"></script>
<script>
const T=THREE,M=MiniatureEditor,races=Object.keys(M.races).filter(r=>r!=='Custom'),canvas=document.querySelector('canvas'),labels=document.querySelector('.labels'),renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(1200,820,false);renderer.setClearColor(0x151a22,1);
const controls={outfit:document.querySelector('#outfit'),hair:document.querySelector('#hair'),headgear:document.querySelector('#headgear'),raceDetail:document.querySelector('#raceDetail')};for(const [key,select]of Object.entries(controls)){for(const value of M.choices[key])select.add(new Option(value,value));select.value=key==='hair'?'Bald':key==='raceDetail'?'Classic':M.choices[key][0];select.onchange=rebuild;}labels.replaceChildren(...races.map(r=>Object.assign(document.createElement('span'),{textContent:r})));
let scene,models=[];const camera=M.createCamera(T,{race:'Human',miniature:{frame:'Full body'}});camera.left=-6;camera.right=6;camera.top=6.2;camera.bottom=-4.6;camera.position.set(0,0,14);camera.lookAt(0,0,0);camera.updateProjectionMatrix();
function rebuild(){for(const model of models)M.dispose(model);scene=new T.Scene();models=races.map((race,i)=>{const miniature=Object.fromEntries(Object.entries(controls).map(([k,v])=>[k,v.value])),model=M.build(T,{race,miniature});model.scale.multiplyScalar(.74);model.position.set((i%5-2)*2.25,(1.5-Math.floor(i/5))*2.72,0);model.rotation.y=.22;scene.add(model);return model;});scene.add(new T.HemisphereLight(0xe4efff,0x4d3b34,1));const key=new T.DirectionalLight(0xffe4c8,1.1);key.position.set(-4,7,8);scene.add(key);}
rebuild();let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(document.querySelector('#rotate').checked)for(const model of models)model.rotation.y+=dt*.35;renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
